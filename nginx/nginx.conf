events { worker_connections 1024; }

http {
  include      mime.types;
  default_type application/octet-stream;
  gzip         on;
  gzip_types   text/plain application/json application/javascript text/css;

  server {
    listen 80;
    server_name localhost;

    resolver 127.0.0.11 valid=10s;

    # Allow camera and microphone access through the proxy
    add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;

    set $frontend_upstream http://frontend:5173;
    set $backend_upstream  http://backend:4000;

    # Frontend
    location / {
      proxy_pass         $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
    }

    # Backend API
    location /api/ {
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }

    # Socket.IO
    location /socket.io/ {
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_read_timeout 3600s;
    }
  }
}