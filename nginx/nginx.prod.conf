events { worker_connections 1024; }

http {
  include      mime.types;
  default_type application/octet-stream;

  gzip         on;
  gzip_types   text/plain application/json application/javascript text/css image/svg+xml;
  gzip_min_length 256;

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # Security headers
  map $sent_http_content_type $referrer_policy {
    default "strict-origin-when-cross-origin";
  }

  server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS (uncomment when you have SSL certs)
    # return 301 https://$host$request_uri;

    resolver 127.0.0.11 valid=10s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=*, microphone=*, display-capture=*" always;

    set $frontend_upstream http://frontend:80;
    set $backend_upstream  http://backend:4000;

    # Frontend (static build)
    location / {
      proxy_pass         $frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_cache_valid  200 1h;
    }

    # Backend API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Socket.IO
    location /socket.io/ {
      proxy_pass         $backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }
  }

  # HTTPS server (uncomment when you have SSL certs from Let's Encrypt)
  # server {
  #   listen 443 ssl http2;
  #   server_name yourdomain.com;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   # ... same location blocks as above ...
  # }
}
